; Shared settings
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
debug_tool = esp-builtin
upload_protocol = esp-builtin
debug_load_mode = always
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:esp32-c6-devkitm-1]
board = esp32-c6-devkitm-1
platform_packages =
  platformio/tool-riscv32-esp-elf-gdb
debug_server =
  /opt/openocd-esp32/bin/openocd
  -s
  /opt/openocd-esp32/share/openocd/scripts
  -f
  interface/esp_usb_jtag.cfg
  -f
  target/esp32c6.cfg
debug_extra_cmds =
  monitor program_esp .pio/build/esp32-c6-devkitm-1/firmware.bin 0x10000 verify
  monitor reset halt

[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
platform_packages =
  platformio/tool-openocd-esp32@^2.1200.20230419
  platformio/tool-xtensa-esp-elf-gdb
debug_server =
  ${platformio.packages_dir}/tool-openocd-esp32/bin/openocd
  -s
  ${platformio.packages_dir}/tool-openocd-esp32/share/openocd/scripts
  -f
  interface/esp_usb_jtag.cfg
  -f
  target/esp32s3.cfg
  -c
  "set ESP_RTOS none"
debug_extra_cmds =
  monitor program_esp .pio/build/esp32-s3-devkitc-1/firmware.bin 0x10000 verify
  monitor reset halt